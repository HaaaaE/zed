[workspace]
resolver = "2"
members = [
    "crates/markdown_editor",
    "crates/markdown_wysiwyg",
    "crates/md_assets",
    "crates/md_buffer",
    "crates/md_editor",
    "crates/md_projection",
    "crates/md_rope",
    "crates/md_settings",
    "crates/md_sum_tree",
    "crates/md_text",
    "crates/md_theme",
]
default-members = ["crates/markdown_editor"]

[workspace.package]
publish = false
edition = "2024"

[workspace.dependencies]

# Workspace member crates
collections = { path = "crates/collections", version = "0.1.0" }
markdown_wysiwyg = { path = "crates/markdown_wysiwyg" }
md_assets = { path = "crates/md_assets" }
md_buffer = { path = "crates/md_buffer" }
md_editor = { path = "crates/md_editor" }
md_projection = { path = "crates/md_projection" }
md_rope = { path = "crates/md_rope" }
md_settings = { path = "crates/md_settings" }
md_sum_tree = { path = "crates/md_sum_tree" }
md_text = { path = "crates/md_text" }
md_theme = { path = "crates/md_theme" }
perf = { path = "tooling/perf" }
util_macros = { path = "crates/util_macros" }

# External crates
anyhow = "1.0.86"
bytes = "1.0"
chrono = { version = "0.4", features = ["serde"] }
comrak = { version = "0.52.0", default-features = false }
entities = "1.0.1"
futures = "0.3.32"
gpui = "0.2.2"
heapless = "0.9.2"
image = "0.25.1"
indexmap = { version = "2.7.0", features = ["serde"] }
log = { version = "0.4.16", features = ["kv_unstable_serde", "serde"] }
parking_lot = "0.12.1"
postage = { version = "0.5", features = ["futures-traits"] }
proptest = { git = "https://github.com/proptest-rs/proptest", rev = "3dca198a8fef1b32e3a66f1e1897c955b4dc5b5b", features = ["attr-macro"] }
pulldown-cmark = "0.13.4"
quote = "1.0.9"
rand = "0.9"
ratex-layout = "0.1.9"
ratex-parser = "0.1.9"
ratex-render = { version = "0.1.9", features = ["embed-fonts"] }
ratex-types = "0.1.9"
rayon = "1.8"
regex = "1.5"
rustc-hash = "2.1.0"
serde = { version = "1.0.221", features = ["derive", "rc"] }
serde_json = { version = "1.0.144", features = ["preserve_order", "raw_value"] }
smallvec = { version = "1.6", features = ["union", "const_new"] }
syn = { version = "2.0.101", features = ["full", "extra-traits", "visit-mut"] }
tracing = "0.1.40"
tree-sitter = { version = "0.26.8", features = ["wasm"] }
tree-sitter-md = { git = "https://github.com/tree-sitter-grammars/tree-sitter-markdown", rev = "9a23c1a96c0513d8fc6520972beedd419a973539" }
unicode-segmentation = "1.10"
ureq = { version = "3.3.0", default-features = false, features = ["rustls", "gzip", "platform-verifier"] }

[patch.crates-io]
async-task = { git = "https://github.com/smol-rs/async-task.git", rev = "b4486cd71e4e94fbda54ce6302444de14f4d190e" }

[profile.dev]
split-debuginfo = "unpacked"
incremental = true
codegen-units = 16

# mirror configuration for crates compiled for the build platform
# (without this cargo will compile ~400 crates twice)
[profile.dev.build-override]
codegen-units = 16
split-debuginfo = "unpacked"
debug = true

[profile.dev.package]
# proc-macros start
util_macros = { opt-level = 3 }
quote = { opt-level = 3 }
syn = { opt-level = 3 }
proc-macro2 = { opt-level = 3 }
# proc-macros end

tree-sitter = { opt-level = 3 }
taffy = { opt-level = 3 }
resvg = { opt-level = 3 }
wasmtime = { opt-level = 3 }
cranelift-codegen = { opt-level = 3 }
wasmtime-environ = { opt-level = 3 }
wasmtime-internal-cranelift = { opt-level = 3 }

[profile.release]
debug = "limited"
lto = "thin"
codegen-units = 1

[profile.release-fast]
inherits = "release"
debug = "full"
lto = false
codegen-units = 16

[workspace.lints.rust]
unexpected_cfgs = { level = "allow" }

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

declare_interior_mutable_const = "deny"

redundant_clone = "deny"
disallowed_methods = "deny"

# Keep style lints permissive while this repository is still being split out.
style = { level = "allow", priority = -1 }

# Individual rules that have violations in the codebase:
type_complexity = "allow"
let_underscore_future = "allow"

# Motivation: We use `vec![a..b]` a lot when dealing with ranges in text, so
# warning on this rule produces a lot of noise.
single_range_in_vec_init = "allow"

# in Rust it can be very tedious to reduce argument count without
# running afoul of the borrow checker.
too_many_arguments = "allow"

# We often have large enum variants yet we rarely actually bother with splitting them up.
large_enum_variant = "allow"

# Boolean expressions can be hard to read, requiring only the minimal form gets in the way
nonminimal_bool = "allow"

[workspace.metadata.cargo-machete]
ignored = [
    "bindgen",
    "cbindgen",
    "prost_build",
    "serde",
    "component",
    "documented",
    "sea-orm-macros",
]

