accepted = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]

# Release installers should include runtime/build/transitive dependency notices,
# but not test-only or unpublished workspace crate licenses.
ignore-build-dependencies = false
ignore-dev-dependencies = true
ignore-transitive-dependencies = false

workarounds = [
    "chrono",
    "ring",
    "rustix",
    "rustls",
    "wasmtime",
]

[private]
ignore = true
