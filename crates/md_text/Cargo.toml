[package]
name = "md_text"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"
description = "Text buffer primitives for md_* stack; ported from crates/text"

[lints]
workspace = true

[lib]
path = "src/text.rs"
doctest = false

[features]
test-support = ["rand"]

[dependencies]
anyhow.workspace = true
log.workspace = true
parking_lot.workspace = true
postage.workspace = true
rand = { workspace = true, optional = true }
regex.workspace = true
# alias md_rope as 'rope' and md_sum_tree as 'sum_tree' so copied source needs no edits
rope = { path = "../md_rope", package = "md_rope" }
rustc-hash.workspace = true
serde.workspace = true
smallvec.workspace = true
sum_tree = { path = "../md_sum_tree", package = "md_sum_tree" }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
rand.workspace = true
