[package]
name = "md_rope"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"
description = "Rope for md_* text stack; ported from crates/rope"

[lints]
workspace = true

[lib]
path = "src/rope.rs"

[dependencies]
heapless.workspace = true
log.workspace = true
rayon.workspace = true
# alias md_sum_tree as 'sum_tree' so copied source needs no edits
sum_tree = { path = "../md_sum_tree", package = "md_sum_tree" }
unicode-segmentation.workspace = true
util.workspace = true
ztracing.workspace = true
tracing.workspace = true

[dev-dependencies]
ctor.workspace = true
gpui = { workspace = true, features = ["test-support"] }
rand.workspace = true
util = { workspace = true, features = ["test-support"] }
zlog.workspace = true

[package.metadata.cargo-machete]
ignored = ["tracing"]
