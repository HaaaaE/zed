[package]
name = "md_sum_tree"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "Apache-2.0"
description = "Sum-tree (B-tree) for md_* text stack; ported from crates/sum_tree"

[lints]
workspace = true

[lib]
path = "src/sum_tree.rs"
doctest = false

[features]
test-support = ["proptest"]

[dependencies]
heapless.workspace = true
rayon.workspace = true
log.workspace = true
tracing.workspace = true
proptest = { workspace = true, optional = true }

[dev-dependencies]
rand.workspace = true
proptest.workspace = true
