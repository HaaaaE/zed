[package]
name = "markdown_editor"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[[bin]]
name = "markdown-editor"
path = "src/main.rs"

[features]
default = ["md-editor"]
legacy-editor = [
    "dep:assets",
    "dep:clock",
    "dep:collections",
    "dep:editor",
    "dep:language",
    "dep:markdown",
    "dep:multi_buffer",
    "dep:md_buffer",
    "dep:settings",
    "dep:theme",
    "dep:theme_settings",
    "dep:ui",
    "dep:http_client",
    "dep:ureq",
    "dep:smol",
    "dep:http",
]
md-editor = [
    "dep:md_editor",
    "dep:md_buffer",
    "dep:md_theme",
    "dep:md_settings",
    "dep:md_assets",
]

[dependencies]
anyhow.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
markdown_wysiwyg.workspace = true
futures.workspace = true

# legacy-editor dependencies (default feature)
assets = { workspace = true, optional = true }
clock = { workspace = true, optional = true }
collections = { workspace = true, optional = true }
editor = { workspace = true, optional = true }
language = { workspace = true, optional = true }
markdown = { workspace = true, optional = true }
multi_buffer = { workspace = true, optional = true }
settings = { workspace = true, optional = true }
theme = { workspace = true, optional = true }
theme_settings = { workspace = true, optional = true }
ui = { workspace = true, optional = true }
http_client = { workspace = true, optional = true }
ureq = { version = "3", default-features = true, features = ["rustls"], optional = true }
smol = { workspace = true, optional = true }
http = { workspace = true, optional = true }

# md-editor dependencies (R3+, not default)
md_editor = { workspace = true, optional = true }
md_buffer = { workspace = true, optional = true }
md_theme = { workspace = true, optional = true }
md_settings = { workspace = true, optional = true }
md_assets = { workspace = true, optional = true }
